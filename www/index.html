<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Vyra Music Player</title>

<!-- PWA: bikin ini kebuka standalone (tanpa address bar browser) pas diinstall -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1c1024" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vyra" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap"
/>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #4a2f52 0%, #1c1024 45%, #0a0710 100%),
                linear-gradient(120deg, #4a2f52, #341c46, #5b2a4a, #1c1024, #3a2350, #4a2f52);
    background-size: 100% 100%, 320% 320%;
    animation: bgFlow 18s ease-in-out infinite;
    padding: 24px;
    color: #f5eef7;
    overflow: hidden;
    position: relative;
  }
  @keyframes bgFlow {
    0% { background-position: 0 0, 0% 50%; }
    50% { background-position: 0 0, 100% 50%; }
    100% { background-position: 0 0, 0% 50%; }
  }

  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .bg-root {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    will-change: filter;
    transition: filter 0.5s ease;
  }

  .bg-grid {
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.22;
    background-image:
      linear-gradient(rgba(245,238,247,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,238,247,0.09) 1px, transparent 1px);
    background-size: 56px 56px, 56px 56px;
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
    animation: gridDrift 34s linear infinite;
  }
  @keyframes gridDrift {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 56px 112px, 112px 56px; }
  }

  .aurora-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    transition: transform 0.9s cubic-bezier(0.16,0.9,0.2,1);
  }
  .aurora {
    position: absolute;
    z-index: 0;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.55;
    will-change: transform, opacity;
  }
  .aurora-a {
    width: 460px; height: 460px;
    top: -120px; left: -100px;
    background: radial-gradient(circle, rgba(255,159,67,0.65), rgba(255,159,67,0) 70%);
    animation: driftA 22s ease-in-out infinite;
  }
  .aurora-b {
    width: 500px; height: 500px;
    bottom: -160px; right: -120px;
    background: radial-gradient(circle, rgba(217,79,140,0.6), rgba(217,79,140,0) 70%);
    animation: driftB 26s ease-in-out infinite;
  }
  .aurora-c {
    width: 380px; height: 380px;
    top: 40%; left: 60%;
    background: radial-gradient(circle, rgba(120,80,220,0.5), rgba(120,80,220,0) 70%);
    animation: driftC 30s ease-in-out infinite;
  }
  .aurora-d {
    width: 340px; height: 340px;
    top: 6%; right: -80px;
    background: radial-gradient(circle, rgba(64,220,220,0.5), rgba(64,220,220,0) 70%);
    animation: driftD 33s ease-in-out infinite;
  }
  .aurora-e {
    width: 300px; height: 300px;
    bottom: 4%; left: -70px;
    background: radial-gradient(circle, rgba(255,214,120,0.5), rgba(255,214,120,0) 70%);
    animation: driftE 27s ease-in-out infinite;
  }
  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 80px) scale(1.15); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, -50px) scale(1.1); }
  }
  @keyframes driftC {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) translate(-40px, 60px) scale(1.2); }
  }
  @keyframes driftD {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-50px, 60px) scale(1.12); }
    66% { transform: translate(-90px, -20px) scale(0.94); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes driftE {
    0% { transform: translate(0, 0) scale(1); }
    40% { transform: translate(70px, -40px) scale(1.08); }
    75% { transform: translate(30px, 50px) scale(0.96); }
    100% { transform: translate(0, 0) scale(1); }
  }

  /* ---- shooting stars streaking across the background ---- */
  .shooting-star {
    position: fixed;
    z-index: 0;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #f5eef7;
    pointer-events: none;
    box-shadow: 0 0 8px 2px rgba(245,238,247,0.9);
    transform: scale(var(--star-scale, 1));
  }
  .shooting-star::before {
    content: '';
    position: absolute;
    top: 50%; right: 0;
    width: 150px; height: 1.5px;
    transform: translateY(-50%) rotate(var(--star-rot, 0deg));
    transform-origin: right center;
    background: linear-gradient(90deg, rgba(245,238,247,0.95), rgba(245,238,247,0.15) 55%, transparent);
    filter: blur(0.3px);
  }
  @keyframes shootAcross {
    0% { transform: scale(var(--star-scale, 1)) translate(0, 0); opacity: 0; }
    6% { opacity: 1; }
    80% { opacity: 0.9; }
    100% { transform: scale(var(--star-scale, 1)) translate(var(--sx), var(--sy)); opacity: 0; }
  }

  /* ---- twinkling starfield, sits behind the aurora glow ---- */
  .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg-star {
    position: absolute;
    border-radius: 50%;
    background: #f5eef7;
    opacity: 0.15;
    animation: starTwinkle ease-in-out infinite;
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.12; transform: scale(0.85); }
    50% { opacity: 0.85; transform: scale(1.15); }
  }

  /* ---- ripple spawned by clicking the empty background ---- */
  .click-ripple {
    position: fixed;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    border: 1.5px solid rgba(245,238,247,0.65);
    z-index: 2;
    pointer-events: none;
    animation: clickRippleOut 0.9s cubic-bezier(0.15,0.6,0.3,1) forwards;
  }
  @keyframes clickRippleOut {
    0% { opacity: 0.85; transform: scale(0.4); border-color: rgba(255,205,160,0.75); }
    100% { opacity: 0; transform: scale(11); border-color: rgba(150,110,230,0.25); }
  }

  .stage {
    position: relative;
    z-index: 1;
    perspective: 1400px;
  }
  .float-wrap {
    animation: floatBob 5.5s ease-in-out infinite;
  }
  @keyframes floatBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.006); }
  }

  .card {
    position: relative;
    width: 390px;
    max-width: 100%;
    height: 700px;
    max-height: 100vh;
    border-radius: 40px;
    overflow: hidden;
    background: rgba(20, 12, 26, 0.55);
    backdrop-filter: blur(40px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
  }
  @media (max-width: 480px) {
    .stage { perspective: 900px; }
    body {
      padding: 20px 16px;
      /* animating a full-screen gradient repaints the whole viewport every
         frame — way too heavy for phone GPUs, so freeze it on mobile */
      animation: none;
      background-position: 0 0, 30% 40%;
    }
    .card {
      width: min(360px, 84vw);
      height: min(660px, 76vh);
      border-radius: 32px;
      /* backdrop blur is the single heaviest thing to render on phone GPUs —
         swap it for a plain solid panel instead of resampling the animated
         background behind it 60x a second */
      backdrop-filter: none;
      background: rgba(18, 10, 24, 0.94);
    }
  }
  @media (max-width: 480px) and (max-height: 700px) {
    .card { height: min(560px, 70vh); }
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(155deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.12));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 5;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -20%;
    left: -60%;
    width: 34%;
    height: 140%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: skewX(-18deg);
    z-index: 6;
    pointer-events: none;
    animation: glassSweep 8s ease-in-out infinite;
  }
  @keyframes glassSweep {
    0% { left: -60%; opacity: 0; }
    8% { opacity: 0.9; }
    38% { opacity: 0.9; }
    52% { left: 140%; opacity: 0; }
    100% { left: 140%; opacity: 0; }
  }
  .icon-btn {
    background: none;
    border: none;
    color: rgba(245,238,247,0.85);
    padding: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .transport-btn {
    background: none;
    border: none;
    color: #f5eef7;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .transport-btn:disabled { cursor: default; opacity: 0.35; }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }
  .icon-btn.active-like { color: #ff5c7a; }
  .icon-btn.active-like svg { fill: #ff5c7a; animation: likePop 0.35s ease; }
  @keyframes likePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .icon-btn.active-shuffle { color: #ff9f43; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 4px;
    flex-shrink: 0;
  }
  .topbar-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(245,238,247,0.5);
    font-weight: 600;
  }

  .artwork-zone { flex: 1; min-height: 0; padding: 16px 28px 0; display: flex; align-items: center; }
  .artwork-wrap { position: relative; width: 100%; }
  .artwork-halo {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    background: conic-gradient(from 0deg, rgba(255,159,67,0.65), rgba(217,79,140,0.55), rgba(120,80,220,0.55), rgba(255,159,67,0.65));
    filter: blur(28px);
    opacity: 0;
    display: none;
    animation: haloSpin 24s linear infinite;
  }
  @keyframes haloSpin { to { transform: rotate(360deg); } }
  .artwork-glow {
    position: absolute;
    inset: -20px;
    border-radius: 28px;
    background: radial-gradient(circle, rgba(255,159,67,0.55), rgba(217,79,140,0.35) 55%, rgba(217,79,140,0) 75%);
    filter: blur(24px);
    z-index: 0;
    opacity: 0.3;
    display: none;
    animation: idleGlow 4.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes idleGlow {
    0%, 100% { opacity: 0.28; }
    50% { opacity: 0.48; }
  }
  .water-ripple {
    position: absolute;
    inset: -8px;
    border-radius: 24px;
    border: 1.5px solid rgba(245,238,247,0.55);
    pointer-events: none;
    z-index: 3;
    animation: waterRippleOut 2.6s cubic-bezier(0.15,0.55,0.3,1) forwards;
  }
  @keyframes waterRippleOut {
    0% { opacity: 0.48; transform: scale(0.95); border-color: rgba(255,205,160,0.6); }
    55% { opacity: 0.22; }
    100% { opacity: 0; transform: scale(1.55); border-color: rgba(150,110,230,0.3); }
  }
  .artwork {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: none;
    position: relative;
    z-index: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .artwork:not(.has-track)::before {
    content: '';
    position: absolute;
    inset: -60%;
    background: conic-gradient(from 0deg, #ff9f43, #d94f8c, #7850dc, #ff9f43);
    animation: spinRing 5s linear infinite;
    opacity: 0.85;
  }
  .artwork:not(.has-track)::after {
    content: '';
    position: absolute;
    inset: 1.5px;
    border-radius: 18px;
    background: #1c1024;
  }
  @keyframes spinRing { to { transform: rotate(360deg); } }
  .artwork.has-track {
    background: linear-gradient(135deg, #ff9f43 0%, #d94f8c 40%, #5b2a86 75%, #1c1024 100%);
    background-size: 260% 260%;
    border: none;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    animation: breathe 3.6s ease-in-out infinite, gradientDrift 9s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }
  @keyframes gradientDrift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }
  .artwork.has-track::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 2px, transparent 2px, transparent 14px);
  }
  .artwork svg { position: relative; z-index: 2; color: rgba(245,238,247,0.35); }
  .artwork.has-track svg { color: rgba(255,255,255,0.85); }

  .artwork-logo {
    position: relative;
    z-index: 2;
    width: 38%;
    max-width: 140px;
    object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.35));
    opacity: 0.62;
    transform: scale(1) translate3d(0,0,0);
    transition: opacity 0.4s ease, filter 0.4s ease;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
  }
  .artwork.has-track .artwork-logo {
    opacity: 0.96;
  }
  .artwork-logo-shine {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.55) 50%, transparent 60%);
    background-size: 220% 220%;
    background-position: 130% 130%;
    mix-blend-mode: screen;
    opacity: 0;
  }
  .artwork-logo-shine.sweep {
    animation: logoShineSweep 1.1s cubic-bezier(0.2,0.7,0.3,1) forwards;
  }
  @keyframes logoShineSweep {
    0% { background-position: 160% -60%; opacity: 0; }
    12% { opacity: 0.9; }
    60% { opacity: 0.9; }
    100% { background-position: -60% 160%; opacity: 0; }
  }

  .upload-fab {
    position: absolute;
    right: -8px;
    bottom: -8px;
    z-index: 2;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px solid rgba(20,12,26,0.85);
    background: linear-gradient(135deg, #ff9f43, #d94f8c);
    color: #1c1024;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(217,79,140,0.5);
  }

  .track-info { padding: 18px 28px 0; flex-shrink: 0; }
  .track-name {
    font-size: 19px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
  }
  .track-name-track { display: inline-flex; }
  .track-name.marquee { text-overflow: unset; }
  .track-name.marquee .track-name-track {
    animation: marqueeScroll linear infinite;
    animation-duration: var(--marquee-dur, 8s);
  }
  .track-name.marquee .track-name-track::after {
    content: attr(data-text);
    padding-left: 48px;
  }
  @keyframes marqueeScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-100% - 48px)); }
  }
  .track-name.has-track { text-shadow: 0 0 18px rgba(255,159,67,0.45), 0 0 40px rgba(217,79,140,0.25); }
  .track-sub { font-size: 13px; color: rgba(245,238,247,0.55); margin-top: 2px; min-height: 16px; }
  .track-sub.error { color: #ff9f9f; }

  .visualizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 26px;
    margin-top: 12px;
  }
  .visualizer .bar {
    width: 3px;
    border-radius: 2px 2px 0 0;
    background: linear-gradient(180deg, #ff9f43, #d94f8c);
    box-shadow: 0 0 6px rgba(255,159,67,0.55);
    height: 4px;
    opacity: 0.25;
    transition: opacity 0.3s ease;
  }

  .scrub-zone { padding: 14px 28px 0; flex-shrink: 0; }
  .scrub {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    cursor: pointer;
    background: rgba(245,238,247,0.22);
  }
  .scrub::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #f5eef7;
    box-shadow: 0 0 10px rgba(245,238,247,0.7);
    cursor: pointer;
    margin-top: -4.5px;
  }
  .scrub::-moz-range-thumb {
    width: 13px; height: 13px;
    border: none;
    border-radius: 50%;
    background: #f5eef7;
    box-shadow: 0 0 10px rgba(245,238,247,0.7);
    cursor: pointer;
  }
  .scrub:disabled { opacity: 0.35; cursor: default; }
  .scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; }
  .time-row { display: flex; justify-content: space-between; font-size: 12px; color: rgba(245,238,247,0.5); margin-top: 6px; }

  .transport { display: flex; align-items: center; justify-content: space-between; padding: 20px 30px 34px; flex-shrink: 0; }
  .play-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: background 0.3s ease;
  }
  .play-btn.has-track {
    background: linear-gradient(135deg, #ff9f43, #d94f8c);
    background-size: 230% 230%;
    animation: playBtnGradient 6s ease-in-out infinite, playBtnPulse 3s ease-in-out infinite;
    box-shadow: 0 0 24px rgba(255,159,67,0.35);
  }
  .play-btn.has-track svg { fill: #1c1024 !important; stroke: #1c1024 !important; }
  @keyframes playBtnGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes playBtnPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .playlist-overlay {
    position: absolute;
    inset: 0;
    background: rgba(6,3,10,0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    z-index: 10;
  }
  .playlist-overlay.open { display: flex; }
  .playlist-sheet {
    width: 100%;
    max-height: 72%;
    background: rgba(28,16,36,0.92);
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    padding: 18px 20px 24px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
    position: relative;
    cursor: grab;
  }
  .playlist-sheet::before {
    content: '';
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    border-radius: 4px;
    background: rgba(245,238,247,0.25);
  }
  .playlist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; margin-top: 6px; }
  .playlist-title { font-size: 17px; font-weight: 700; }
  .playlist-empty { font-size: 14px; color: rgba(245,238,247,0.45); padding: 20px 4px; text-align: center; }
  .playlist-items { overflow-y: auto; }
  .playlist-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 6px; border-radius: 14px; cursor: pointer;
  }
  .playlist-item.active { background: rgba(255,255,255,0.08); }
  .playlist-thumb {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .playlist-thumb.has-file { background: linear-gradient(135deg, #ff9f43, #d94f8c); }
  .playlist-meta { flex: 1; min-width: 0; }
  .playlist-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist-sub { font-size: 11px; color: rgba(245,238,247,0.45); margin-top: 2px; }
  .playlist-bar { height: 3px; border-radius: 2px; background: rgba(245,238,247,0.15); margin-top: 6px; overflow: hidden; }
  .playlist-bar-fill { height: 100%; background: linear-gradient(90deg, #ff9f43, #d94f8c); }
  .add-music-btn {
    margin-top: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: 14px;
    border: 1.5px dashed rgba(245,238,247,0.25);
    background: transparent;
    color: rgba(245,238,247,0.7);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .storage-note { font-size: 12px; color: rgba(245,238,247,0.45); margin-bottom: 10px; }

  /* ---- sprinkle / sparkle bits ---- */
  .sprinkle-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
    border-radius: inherit;
  }
  .sprinkle {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transform-origin: center;
    animation: sprinkleTwinkle 2.6s ease-in-out infinite;
    filter: drop-shadow(0 0 4px currentColor);
  }
  @keyframes sprinkleTwinkle {
    0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
    45% { opacity: 0.95; transform: scale(1) rotate(90deg); }
    60% { opacity: 0.7; transform: scale(0.85) rotate(120deg); }
    100% { opacity: 0; transform: scale(0.2) rotate(180deg); }
  }
  .sprinkle-burst {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    animation: sprinkleFly 0.9s cubic-bezier(0.2,0.7,0.3,1) forwards;
  }
  @keyframes sprinkleFly {
    0% { opacity: 1; transform: translate(0,0) scale(0.6) rotate(0deg); }
    100% { opacity: 0; transform: var(--fly-to, translate(40px,-60px)) scale(1.1) rotate(200deg); }
  }
  @keyframes doubleTapHeart {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(-10deg); }
    35% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(4deg); }
    60% { transform: translate(-50%,-50%) scale(0.95) rotate(-2deg); }
    100% { opacity: 0; transform: translate(-50%,-58%) scale(1) rotate(0deg); }
  }

  /* ---- tactile press feedback for touch/mobile ---- */
  .icon-btn, .transport-btn, .upload-fab, .add-music-btn, .playlist-item {
    transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, color 0.2s ease;
  }
  .icon-btn:active:not(:disabled),
  .transport-btn:active:not(:disabled),
  .add-music-btn:active { transform: scale(0.86); }
  .upload-fab:active { transform: scale(0.88); }
  .upload-fab {
    animation: fabPulse 2.8s ease-in-out infinite;
  }
  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(217,79,140,0.5); }
    50% { box-shadow: 0 8px 34px rgba(255,159,67,0.75); }
  }
  .playlist-item:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }

  @media (hover: hover) {
    .icon-btn:hover:not(:disabled) { color: #fff; }
    .transport-btn:hover:not(:disabled) { transform: scale(1.08); }
    .playlist-item:hover { background: rgba(255,255,255,0.06); }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  const LIBRARY_KEY = "player:library";
  const hasLocalStorage = (() => {
    try {
      localStorage.setItem("__t", "1");
      localStorage.removeItem("__t");
      return true;
    } catch (e) {
      return false;
    }
  })();

  // ---- IndexedDB: persistent storage for the actual audio file blobs.
  // localStorage only ever held light metadata (name/progress/duration) —
  // the audio itself used to live only in memory and vanished on every
  // reload/app-restart. This makes uploaded songs actually stick around. ----
  const IDB_NAME = "vyra-player";
  const IDB_STORE = "tracks";
  let idbPromise = null;
  function openIdb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((resolve) => {
      if (!window.indexedDB) { resolve(null); return; }
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return idbPromise;
  }
  async function idbSaveBlob(id, blob) {
    const db = await openIdb();
    if (!db) return;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(blob, id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  }
  async function idbGetBlob(id) {
    const db = await openIdb();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  }
  async function idbDeleteBlob(id) {
    const db = await openIdb();
    if (!db) return;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  }

  function formatTime(s) {
    if (!isFinite(s) || s < 0) return "0:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, "0");
    return `${m}:${sec}`;
  }
  function uid() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  // ---- state ----
  let tracks = [];          // {id, name, size, duration, progress, addedAt, url, hasFile}
  let currentId = null;
  let playing = false;
  let progress = 0;
  let duration = 0;
  let playlistOpen = false;
  let playbackError = "";
  let resumeTargetId = null;
  let autoPlayNext = false;
  let lastSave = 0;

    if (!isLowPower) {

    // Louder music nudges it a bit faster (1.9–2.8s) but never bursts.
    if (cur && isActive) {

      [auroraA, auroraB, auroraC, auroraD, auroraE].forEach((el) => { el.style.opacity = "0.55"; });
    }

    // whole background layer subtly shifts hue with the music's mids —
    // a slow, colorful drift rather than anything jarring
    if (cur) {
      const hue = midSmooth * 26 - 8;
      const bright = 1 + bassSmooth * 0.18;
      bgRoot.style.filter = `hue-rotate(${hue.toFixed(1)}deg) brightness(${bright.toFixed(3)})`;
    } else {
      bgRoot.style.filter = "";
    }

    // rotating halo ring behind the artwork — always spinning gently while
    // a track is loaded, brightens a bit with the music instead of punching
    if (cur) {
      artworkHalo.style.display = "block";
      artworkHalo.style.opacity = Math.min(0.85, 0.4 + bassSmooth * 0.45).toFixed(3);
    } else {
      artworkHalo.style.display = "none";
    }

    // glow behind artwork — smooth breathing, no sudden kicks
    if (cur) {
      artworkGlow.style.display = "block";
      const glowOpacity = Math.min(1, 0.35 + bassSmooth * 0.55);
      const glowScale = 1 + bassSmooth * 0.2;
      const hueShift = midSmooth * 40 - 12;
      artworkGlow.style.opacity = glowOpacity.toFixed(3);
      artworkGlow.style.transform = `scale(${glowScale.toFixed(3)})`;
      artworkGlow.style.filter = `blur(${isLowPower ? 12 : 24}px) hue-rotate(${hueShift.toFixed(1)}deg)`;
    } else {
      artworkGlow.style.display = "none";
      artworkGlow.style.filter = "";
    }

    // logo itself: parallax-tilts with the card, and pulses gently with the
    // beat while a track is loaded (or breathes softly on its own when idle)
    if (cur) {
      const logoScale = 1 + bassSmooth * 0.1;
      const logoBlur = 18 + bassSmooth * 26;
      const logoAlpha = 0.5 + bassSmooth * 0.5;
      artworkLogo.style.transform = `translate3d(${logoTiltX.toFixed(2)}px, ${logoTiltY.toFixed(2)}px, 0) scale(${logoScale.toFixed(3)})`;
      artworkLogo.style.filter = `drop-shadow(0 8px 22px rgba(0,0,0,0.45)) drop-shadow(0 0 ${logoBlur.toFixed(0)}px rgba(255,159,67,${logoAlpha.toFixed(2)}))`;
    } else {
      const breathe = 1 + Math.sin(phase * 0.24) * 0.045;
      artworkLogo.style.transform = `translate3d(${logoTiltX.toFixed(2)}px, ${logoTiltY.toFixed(2)}px, 0) scale(${breathe.toFixed(3)})`;
      artworkLogo.style.filter = "";
    }

    // play button glow — soft, tied to overall loudness only
    if (cur) {
      const spread = 22 + bassSmooth * 38;
      const alpha = 0.34 + bassSmooth * 0.34;
      playBtn.style.boxShadow = isActive
        ? `0 0 ${spread.toFixed(0)}px rgba(255,159,67,${alpha.toFixed(2)})`
        : "";
    } else {
      playBtn.style.boxShadow = "";
    }

    // whole-card rim glow — pulses softly around the card edge with the bass
    if (cur && isActive) {
      const rimSpread = 26 + bassSmooth * 60;
      const rimAlpha = 0.16 + bassSmooth * 0.3;
      const hue = midSmooth * 30;
      card.style.boxShadow = `0 30px 80px rgba(0,0,0,0.6), 0 0 ${rimSpread.toFixed(0)}px rgba(217,${(120 + hue).toFixed(0)},140,${rimAlpha.toFixed(2)})`;
    } else {
      card.style.boxShadow = "0 30px 80px rgba(0,0,0,0.6)";
    }

    // frequency bar visualizer
    for (let i = 0; i < visBars.length; i++) {
      let target;
      if (isActive) {
        const idx = Math.floor((i / visBars.length) * (freqData.length * 0.55));
        target = 4 + (freqData[idx] / 255) * 24;
      } else {
        target = 4 + (Math.sin(phase * 0.6 + i * 0.5) + 1) * 2.5;
      }
      visBars[i].style.height = `${target.toFixed(1)}px`;
      visBars[i].style.opacity = cur ? (isActive ? "1" : "0.4") : "0.2";
    }
  }
  visualLoop();

  function getCurrent() {
    return tracks.find((t) => t.id === currentId) || null;
  }

  // ---- persistence (localStorage for metadata, IndexedDB for the audio itself) ----
  async function loadLibrary() {
    if (!hasLocalStorage) { storageNote.style.display = "block"; return; }
    try {
      const raw = localStorage.getItem(LIBRARY_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        tracks = saved.map((t) => ({ ...t, url: null, hasFile: false }));
      }
    } catch (e) {
      storageNote.style.display = "block";
      return;
    }
    render(); // show the track list immediately, audio reattaches just after
    // try to reattach the actual audio for each track from IndexedDB, so
    // uploaded songs are still playable after a restart/app-update instead
    // of needing to be re-picked from the file browser every time
    await Promise.all(tracks.map(async (t) => {
      const blob = await idbGetBlob(t.id);
      if (blob) {
        const url = URL.createObjectURL(blob);
        objectUrls[t.id] = url;
        t.url = url;
        t.hasFile = true;
      }
    }));
  }
  function persistLibrary() {
    if (!hasLocalStorage) return;
    try {
      const slim = tracks.map(({ id, name, size, duration, progress, addedAt }) => ({
        id, name, size, duration, progress, addedAt,
      }));
      localStorage.setItem(LIBRARY_KEY, JSON.stringify(slim));
    } catch (e) {
      // ignore — playback still works in-memory this session
    }
  }

  // ---- file handling ----
  function attachFile(file, existingId) {
    if (!file) return;
    if (!file.type.startsWith("audio/")) {
      playbackError = "File itu bukan audio.";
      render();
      return;
    }
    playbackError = "";
    const url = URL.createObjectURL(file);
    const id = existingId || uid();
    objectUrls[id] = url;

    const found = tracks.find((t) => t.id === id);
    if (found) {
      found.url = url;
      found.hasFile = true;
      found.size = file.size;
    } else {
      tracks.unshift({
        id, name: file.name, size: file.size, duration: 0,
        progress: 0, addedAt: Date.now(), url, hasFile: true,
      });
    }
    autoPlayNext = Boolean(existingId);
    progress = 0;
    currentId = id;
    persistLibrary();
    idbSaveBlob(id, file); // persist the actual audio so it survives reload / app updates
    loadCurrentIntoAudio();
    render();
    spawnSprinkleBurst(uploadFab);
  }

  fileInput.addEventListener("change", (e) => {
    attachFile(e.target.files && e.target.files[0]);
    e.target.value = "";
  });
  resumeInput.addEventListener("change", (e) => {
    attachFile(e.target.files && e.target.files[0], resumeTargetId);
    e.target.value = "";
    resumeTargetId = null;
  });

  document.body.addEventListener("dragover", (e) => e.preventDefault());
  document.body.addEventListener("drop", (e) => {
    e.preventDefault();
    attachFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  uploadFab.addEventListener("click", () => fileInput.click());
  addMusicBtn.addEventListener("click", () => fileInput.click());

  // ---- playback ----
  function loadCurrentIntoAudio() {
    const cur = getCurrent();
    if (!cur || !cur.url) return;
    audio.src = cur.url;
  }

  function safePlay() {
    const p = audio.play();
    if (p && p.catch) {
      p.catch((err) => {
        playbackError = "Nggak bisa muter file ini di browser kamu.";
        render();
        console.error(err);
      });
    }
  }

  function togglePlay() {
    const cur = getCurrent();
    if (!cur || !cur.url) return;
    ensureAudioGraph();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if (playing) audio.pause();
    else safePlay();
  }

  function restart() {
    const cur = getCurrent();
    if (!cur || !cur.url) return;
    audio.currentTime = 0;
    progress = 0;
    render();
  }

  function skipForward() {
    const cur = getCurrent();
    if (!cur || !cur.url) return;
    audio.currentTime = Math.min(audio.currentTime + 10, duration || 0);
  }

  function goRelative(dir) {
    if (!tracks.length) return;
    if (shuffleOn && tracks.length > 1) {
      let candidates = tracks.filter((t) => t.id !== currentId);
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      selectTrack(pick.id, true);
      return;
    }
    const idx = tracks.findIndex((t) => t.id === currentId);
    const nextIdx = (idx + dir + tracks.length) % tracks.length;
    selectTrack(tracks[nextIdx].id, true);
  }

  function selectTrack(id, continuePlaying) {
    const t = tracks.find((x) => x.id === id);
    if (!t) return;
    if (!t.hasFile || !t.url) {
      resumeTargetId = id;
      resumeInput.click();
      return;
    }
    autoPlayNext = continuePlaying === undefined ? playing : continuePlaying;
    progress = t.progress || 0;
    currentId = id;
    playlistOpen = false;
    loadCurrentIntoAudio();
    render();
  }

  function removeTrack(id, evt) {
    evt.stopPropagation();
    if (objectUrls[id]) {
      URL.revokeObjectURL(objectUrls[id]);
      delete objectUrls[id];
    }
    idbDeleteBlob(id);
    tracks = tracks.filter((t) => t.id !== id);
    if (currentId === id) {
      currentId = null;
      playing = false;
      progress = 0;
      duration = 0;
      audio.removeAttribute("src");
      audio.load();
    }
    persistLibrary();
    render();
  }

  audio.addEventListener("timeupdate", () => {
    progress = audio.currentTime;
    const now = performance.now();
    if (now - lastSave > 2000 && currentId) {
      lastSave = now;
      const t = getCurrent();
      if (t) t.progress = progress;
      persistLibrary();
    }
    updateScrubUI();
  });

  audio.addEventListener("loadedmetadata", () => {
    duration = audio.duration;
    const cur = getCurrent();
    if (cur) {
      audio.currentTime = cur.progress || 0;
      cur.duration = duration;
      persistLibrary();
    }
    if (autoPlayNext) {
      autoPlayNext = false;
      safePlay();
    }
    render();
  });

  audio.addEventListener("play", () => {
    playing = true;
    render();
    triggerLogoShine();
    spawnParticleBurst(10);
  });
  audio.addEventListener("pause", () => { playing = false; render(); });
  audio.addEventListener("ended", () => {
    playing = false;
    progress = 0;
    if (tracks.length > 1) {
      goRelative(1);
    } else {
      render();
    }
  });
  audio.addEventListener("error", () => {
    playbackError = "Format file ini nggak didukung browser.";
    render();
  });

  scrub.addEventListener("input", (e) => {
    const val = Number(e.target.value);
    progress = val;
    audio.currentTime = val;
    updateScrubUI();
  });

  prevBtn.addEventListener("click", () => goRelative(-1));
  restartBtn.addEventListener("click", restart);
  playBtn.addEventListener("click", togglePlay);
  forwardBtn.addEventListener("click", skipForward);
  nextBtn.addEventListener("click", () => goRelative(1));

  openPlaylistBtn.addEventListener("click", () => { playlistOpen = true; render(); });
  closePlaylistBtn.addEventListener("click", () => { playlistOpen = false; render(); });
  playlistOverlay.addEventListener("click", () => { playlistOpen = false; render(); });

  // ---- swipe/drag the sheet down to close it (touch + mouse, laptop trackpads included) ----
  const playlistSheet = document.querySelector(".playlist-sheet");
  let dragStartY = null;
  let dragCurrentY = 0;
  function sheetDragStart(y) {
    dragStartY = y;
    dragCurrentY = y;
    playlistSheet.style.transition = "none";
  }
  function sheetDragMove(y) {
    if (dragStartY === null) return;
    dragCurrentY = y;
    const delta = Math.max(0, y - dragStartY);
    playlistSheet.style.transform = `translateY(${delta}px)`;
  }
  function sheetDragEnd() {
    if (dragStartY === null) return;
    const delta = dragCurrentY - dragStartY;
    playlistSheet.style.transition = "transform 0.3s cubic-bezier(0.22,1,0.36,1)";
    if (delta > 90) {
      playlistOpen = false;
      render();
    }
    playlistSheet.style.transform = "";
    dragStartY = null;
  }
  playlistSheet.addEventListener("touchstart", (e) => sheetDragStart(e.touches[0].clientY), { passive: true });
  playlistSheet.addEventListener("touchmove", (e) => sheetDragMove(e.touches[0].clientY), { passive: true });
  playlistSheet.addEventListener("touchend", sheetDragEnd);
  playlistSheet.addEventListener("mousedown", (e) => {
    if (e.target.closest("button") || e.target.closest(".playlist-item")) return;
    sheetDragStart(e.clientY);
    const onMove = (ev) => sheetDragMove(ev.clientY);
    const onUp = () => {
      sheetDragEnd();
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });

  // ---- render ----
  function updateScrubUI() {
    scrub.max = duration || 0;
    scrub.value = progress;
    const pct = duration ? (progress / duration) * 100 : 0;
    scrub.style.background = `linear-gradient(to right, rgba(245,238,247,0.9) ${pct}%, rgba(245,238,247,0.22) ${pct}%)`;
    timeCur.textContent = formatTime(progress);
    timeRemain.textContent = `-${formatTime((duration || 0) - progress)}`;
  }

  // marquee for track names too long to fit — only scrolls when it
  // actually overflows, and speed scales with text length so it always
  // feels like a natural, unhurried scroll rather than a race
  function updateMarquee() {
    requestAnimationFrame(() => {
      trackName.classList.remove("marquee");
      trackNameTrack.style.removeProperty("--marquee-dur");
      const overflow = trackNameText.scrollWidth - trackName.clientWidth;
      if (overflow > 4) {
        trackNameTrack.setAttribute("data-text", trackNameText.textContent);
        const dur = Math.max(6, trackNameText.scrollWidth / 40);
        trackNameTrack.style.setProperty("--marquee-dur", `${dur.toFixed(1)}s`);
        trackName.classList.add("marquee");
      }
    });
  }

  function render() {
    const cur = getCurrent();

    topbarLabel.textContent = cur ? "Sedang Diputar" : "Belum Ada Musik";

    artwork.classList.toggle("has-track", Boolean(cur));

    trackNameText.textContent = cur ? cur.name : "Belum ada file";
    trackName.classList.toggle("has-track", Boolean(cur));
    updateMarquee();

    if (playbackError) {
      trackSub.textContent = playbackError;
      trackSub.classList.add("error");
    } else {
      trackSub.textContent = cur ? "Dari perangkatmu" : "Tap tombol + untuk upload";
      trackSub.classList.remove("error");
    }

    scrub.disabled = !cur;
    [prevBtn, restartBtn, playBtn, forwardBtn, nextBtn].forEach((b) => (b.disabled = !cur));
    playBtn.classList.toggle("has-track", Boolean(cur));
    updateLikeUI();

    updateScrubUI();

    playIcon.innerHTML = playing
      ? '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>'
      : '<polygon points="6 3 20 12 6 21 6 3"></polygon>';

    playlistOverlay.classList.toggle("open", playlistOpen);
    playlistTitle.textContent = tracks.length ? `Playlist \u00b7 ${tracks.length}` : "Playlist";
    renderPlaylist();
  }

  function renderPlaylist() {
    playlistItems.innerHTML = "";
    if (tracks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "playlist-empty";
      empty.textContent = "Belum ada musik yang diupload.";
      playlistItems.appendChild(empty);
      return;
    }

    const pct = duration ? (progress / duration) * 100 : 0;

    tracks.forEach((t) => {
      const isCurrent = t.id === currentId;
      const tp = duration && isCurrent ? pct : (t.duration ? (t.progress / t.duration) * 100 : 0);

      const row = document.createElement("div");
      row.className = "playlist-item" + (isCurrent ? " active" : "");
      row.addEventListener("click", () => selectTrack(t.id, true));

      const thumb = document.createElement("div");
      thumb.className = "playlist-thumb" + (t.hasFile ? " has-file" : "");
      thumb.innerHTML = (isCurrent && playing)
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="#1c1024"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>'
        : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${t.hasFile ? "#1c1024" : "rgba(245,238,247,0.35)"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/></svg>`;

      const meta = document.createElement("div");
      meta.className = "playlist-meta";
      const nameEl = document.createElement("div");
      nameEl.className = "playlist-name";
      nameEl.textContent = t.name;
      const subEl = document.createElement("div");
      subEl.className = "playlist-sub";
      subEl.textContent = t.hasFile
        ? `${formatTime(t.progress || 0)} / ${formatTime(t.duration || 0)}`
        : "Perlu diupload ulang untuk lanjut";
      const bar = document.createElement("div");
      bar.className = "playlist-bar";
      const barFill = document.createElement("div");
      barFill.className = "playlist-bar-fill";
      barFill.style.width = `${tp || 0}%`;
      bar.appendChild(barFill);
      meta.appendChild(nameEl);
      meta.appendChild(subEl);
      meta.appendChild(bar);

      const removeBtn = document.createElement("button");
      removeBtn.className = "icon-btn";
      removeBtn.style.padding = "6px";
      removeBtn.setAttribute("aria-label", "Hapus dari playlist");
      removeBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(245,238,247,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      removeBtn.addEventListener("click", (e) => removeTrack(t.id, e));

      row.appendChild(thumb);
      row.appendChild(meta);
      row.appendChild(removeBtn);
      playlistItems.appendChild(row);
    });
  }

  // ---- init ----
  loadLibrary().then(render);
})();
</script>
<script>
  // register service worker so the app can be installed and opens standalone
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
